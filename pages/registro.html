<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE | Crear cuenta</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>

<header class="site-header">
    <a class="logo" href="../index.html"><span>GAME</span>ZONE</a>

    <nav class="nav-guest">
        <a href="../index.html">Inicio</a>
        <a href="../index.html#planes">Ver planes</a>
        <a class="btn btn-yellow" href="login.html">Iniciar sesión</a>
    </nav>
</header>

<main class="register-page">
    <section class="register-card" id="register-card">
        <h1>Crear una cuenta</h1>

        <form id="register-form">
            <div class="two-columns">
                <div>
                    <label for="name">Nombre</label>
                    <input id="name" type="text" required>
                </div>

                <div>
                    <label for="lastname">Apellido</label>
                    <input id="lastname" type="text" required>
                </div>
            </div>

            <label for="email">Correo electrónico</label>
            <input id="email" type="email" required>

            <label>Fecha de nacimiento</label>
            <div class="birth-row">
                <input id="day" type="number" min="1" max="31" placeholder="Día" required>
                <input id="month" type="number" min="1" max="12" placeholder="Mes" required>
                <input id="year" type="number" min="1900" max="2026" placeholder="Año" required>
            </div>

            <div class="two-columns">
                <div>
                    <label for="username">Nombre de usuario</label>
                    <input id="username" type="text" required>
                </div>

                <div>
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" required>
                </div>
            </div>

            <label for="repeat-password">Repetir contraseña</label>
            <input id="repeat-password" type="password" required>

            <label class="captcha">
                <input type="checkbox" id="captcha" required>
                I'm not a robot
            </label>

            <p class="register-message" id="register-message"></p>

            <button class="btn btn-primary full-button" type="submit">Crear cuenta</button>
        </form>

        <p class="login-link">
            O <a href="login.html">ya tengo una cuenta</a>
        </p>

        <button class="google-button" type="button">G &nbsp; Continuar con Google</button>
    </section>
</main>

<script src="../js/registro.js"></script>
</body>
</html>
