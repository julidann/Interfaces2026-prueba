<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<header class="site-header">
    <a class="logo" href="../index.html"><span>GAME</span>ZONE</a>

    <nav class="nav-guest">
        <a href="../index.html">Inicio</a>
        <a href="../index.html#planes">Ver planes</a>
        <a class="btn btn-yellow" href="login.html">Iniciar sesión</a>
    </nav>
</header>

<main class="auth-page login-background">
    <section class="auth-card">
        <div class="avatar-large">U</div>
        <h1>Iniciar sesión</h1>

        <form id="login-form">
            <label for="login-user">Usuario o email</label>
            <input id="login-user" type="text" required>

            <label for="login-password">Contraseña</label>
            <input id="login-password" type="password" required>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox"> Recordarme
                </label>
                <a href="#">Olvidé mi contraseña</a>
            </div>

            <p class="form-message" id="login-message"></p>

            <button class="btn btn-primary full-button" type="submit">
                Iniciar sesión
            </button>
        </form>

        <p class="switch-auth">O <a href="registro.html">crear una cuenta</a></p>

        <button class="google-button" type="button" id="google-login">
            G &nbsp; Continuar con Google
        </button>
    </section>
</main>

<script src="../js/login.js"></script>
</body>
</html>
